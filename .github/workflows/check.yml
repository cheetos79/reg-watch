name: daily-check

# 평일 오전 7시 40분(한국 시각)에 출처를 수집한다. 보고서 작성은 8시 30분 예약 작업이 맡는다.
on:
  schedule:
    - cron: "40 22 * * 0-4"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources.json"
      - "scripts/check.py"
      - ".github/workflows/check.yml"

permissions:
  contents: write

concurrency:
  group: reg-watch-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 출처 수집
        run: python3 scripts/check.py || echo "check.py exit $?"
      - name: 결과 저장
        run: |
          git config user.name "reg-watch-bot"
          git config user.email "reg-watch-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "수집 $(TZ=Asia/Seoul date +'%F %H:%M')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
