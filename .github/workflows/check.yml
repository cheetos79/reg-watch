name: daily-check

# 출처를 수집한다. 도는 경우는 세 가지다.
# 1. 요청: collect-request.txt가 바뀌어 올라오면 바로 돈다. 8시 30분 예약 작업이 자기 환경에서
#    사이트에 접속하지 못할 때 scripts/collect.sh로 이 파일을 올려 수집을 맡긴다.
# 2. 예약: 평일 오전 7시 40분(한국 시각)으로 걸어 두었으나 GitHub 예약은 몇 시간 늦게 도는 일이 잦다.
#    그래서 오후 보조 수집으로 본다. 이때 잡힌 항목은 다음 날 아침 보고서에 들어간다.
# 3. 수집 코드나 출처 목록이 바뀌어 올라왔을 때.
on:
  schedule:
    - cron: "40 22 * * 0-4"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collect-request.txt"
      - "sources.json"
      - "scripts/check.py"
      - ".github/workflows/check.yml"

permissions:
  contents: write

concurrency:
  group: reg-watch-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 출처 수집
        run: python3 scripts/check.py || echo "check.py exit $?"
      - name: 결과 저장
        run: |
          git config user.name "reg-watch-bot"
          git config user.email "reg-watch-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "수집 $(TZ=Asia/Seoul date +'%F %H:%M')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
